name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: exampilot
          POSTGRES_PASSWORD: exampilot
          POSTGRES_DB: exampilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exampilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://exampilot:exampilot@localhost:5432/exampilot
      REDIS_URL: redis://localhost:6379/0
      STORAGE_DIR: /tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Schema
        run: psql "$DATABASE_URL" -f db/schema.sql -f db/topics.sql
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Retrieval eval gate
        run: |
          for c in daa swe ai; do python -m exampilot.cli ingest samples/$c --course $c --inline; done
          python -m eval.retrieval eval/fixtures/questions.jsonl --all-modes --min-recall 0.80
      - name: Seed smoke test
        run: python -m exampilot.cli seed && python -m exampilot.cli seed --clear

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build
