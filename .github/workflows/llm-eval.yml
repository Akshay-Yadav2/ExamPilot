name: llm-eval
on: workflow_dispatch

jobs:
  answers:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: exampilot
          POSTGRES_PASSWORD: exampilot
          POSTGRES_DB: exampilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exampilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://exampilot:exampilot@localhost:5432/exampilot
      STORAGE_DIR: /tmp/uploads
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: psql "$DATABASE_URL" -f db/schema.sql -f db/topics.sql
      - run: for c in daa swe ai; do python -m exampilot.cli ingest samples/$c --course $c --inline; done
      - run: python -m eval.answers eval/fixtures/questions.jsonl --out eval-report.json --min-score 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
